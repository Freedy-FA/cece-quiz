    body {

      font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif;
      line-height: 1.5;
      overflow-x: hidden;

    .bg {
      position: fixed;
      inset: 0;
      z-index: -2;
      display: grid;
      grid-template-columns: 1fr 1fr;
    }

    .bg::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, rgba(240, 240, 240, .95), rgba(168, 181, 192, .88) 42%, rgba(255, 107, 53, .82) 62%, rgba(255, 46, 99, .9));
      z-index: -1;
    }

    .flow-a,
    .flow-b {
      position: relative;
      overflow: hidden;
    }

    .flow-a::after,
    .flow-b::after {
      content: "";
      position: absolute;
      width: 180%;
      height: 180%;
      left: -40%;
      top: -40%;
      opacity: .34;
      filter: blur(36px);
      animation: drift 17s ease-in-out infinite alternate;
    }

    .flow-a::after {
      background:
        radial-gradient(circle at 25% 25%, #ffffff 0, transparent 32%),
        radial-gradient(circle at 70% 65%, var(--cold-2) 0, transparent 38%),
        radial-gradient(circle at 45% 80%, var(--cold-3) 0, transparent 30%);
    }

    .flow-b::after {
      background:
        radial-gradient(circle at 30% 30%, var(--hot-1) 0, transparent 28%),
        radial-gradient(circle at 68% 55%, var(--hot-2) 0, transparent 35%),
        radial-gradient(circle at 52% 78%, var(--hot-3) 0, transparent 33%);
      animation-delay: -7s;
    }

    @keyframes drift {
      0% {
        transform: translate(-4%, -3%) rotate(0deg) scale(1);
      }
      50% {
        transform: translate(4%, 3%) rotate(9deg) scale(1.08);
      }
      100% {
        transform: translate(-2%, 4%) rotate(-8deg) scale(.97);
      }

      height: 26px;
      background: linear-gradient(90deg, #e8ecef, #c3ccd4, #9aa7b3, #f0b8c4, #f29bae);

    const results = [

    const state = {
      current: 0,
      answers: {},
      temporary: {},
      innerScore: 50,
      outerScore: 50

    const el = id => document.getElementById(id);
    const clampScore = n => Math.max(0, Math.min(100, Math.round(Number(n) || 0)));

    function showScreen(name) {
      ["homeScreen", "testScreen", "resultScreen"].forEach(id => el(id).classList.remove("active"));
      el(name).classList.add("active");
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function toast(msg) {
      const t = el("toast");
      t.textContent = msg;
      t.classList.add("show");
      clearTimeout(t._timer);
      t._timer = setTimeout(() => t.classList.remove("show"), 2600);
    }

    function updateLive() {
      const values = Object.values(state.answers).map(Number);
      const hot = values.length ? Math.round(values.reduce((a, b) => a + b, 0) / values.length) : 50;
      const cold = 100 - hot;
      el("liveHot").textContent = String(hot);
      el("liveCold").textContent = String(cold);
    }

    function renderQuestion() {
      const q = questions[state.current];
      state.temporary = {};
      const card = el("questionCard");
      card.classList.remove("card-enter");
      void card.offsetWidth;
      card.classList.add("card-enter");
      card.innerHTML = `
        <div class="q-index">QUESTION ${String(state.current + 1).padStart(2, "0")}</div>
        <h2 class="q-title">${q.title}</h2>
        ${q.desc ? `<p class="q-desc">${q.desc}</p>` : ""}
        <div class="control" id="controlArea"></div>
        <div class="nav">
          <button id="prevBtn" class="btn ghost small">上一题</button>
          <div class="hint" id="controlHint"></div>
          <button id="nextBtn" class="btn small">下一题 ▶</button>
        </div>`;
      buildControl(q, el("controlArea"));
      el("currentNum").textContent = String(state.current + 1);
      el("progressFill").style.width = `${(state.current / 24) * 100}%`;
      updateLive();
      updateNav(q);
      el("prevBtn").onclick = () => gotoQuestion(Math.max(0, state.current - 1));
      el("nextBtn").onclick = () => nextQuestion();
    }

    function updateNav(q) {
      const done = Number.isFinite(Number(state.answers[q.id]));
      const btn = el("nextBtn");
      btn.disabled = !done;
      btn.style.opacity = done ? "1" : ".45";
      btn.style.cursor = done ? "pointer" : "not-allowed";
      el("controlHint").textContent = done ? "这题收下了。" :
        ({ sort: "排好后自动记录第一名的浓度。", votes: "五个场景都得选。", tags: "至少选一个标签。", text: "先输入并分析。", toggles: "不开也算一种回答。", finalSlider: "拖完才算交代。" }[q.type] || "选择或拖动后继续。");
    }

    function setAnswer(q, value) {
      state.answers[q.id] = clampScore(value);
      updateLive();
      updateNav(q);
    }

    function nextQuestion() {
      const q = questions[state.current];
      if (!Number.isFinite(Number(state.answers[q.id]))) return;
      if (state.current === 23) return finish();
      gotoQuestion(state.current + 1);
    }

    function gotoQuestion(i) {
      state.current = i;
      renderQuestion();
    }

    function buildControl(q, area) {
      if (q.type === "options") return buildOptions(q, area);
      if (q.type === "dual") return buildDual(q, area);
      if (q.type === "dial") return buildDial(q, area);
      if (q.type === "tags") return buildTags(q, area);
      if (q.type === "sort") return buildSort(q, area);
      if (q.type === "toggles") return buildToggles(q, area);
      if (q.type === "text") return buildText(q, area);
      if (q.type === "rangeVote") return buildRangeVote(q, area);
      if (q.type === "timeline") return buildTimeline(q, area);
      if (q.type === "spectrum") return buildSpectrum(q, area);
      if (q.type === "speed") return buildSpeed(q, area);
      if (q.type === "volume") return buildVolume(q, area);
      if (q.type === "votes") return buildVotes(q, area);
      if (q.type === "finalSlider") return buildFinal(q, area);
      setAnswer(q, 50);
      area.innerHTML = "<p>这道题走丢了，已按中位数处理。</p>";
    }

    function buildOptions(q, area) {
      area.innerHTML = `<div class="option-grid ${q.cols || "cols-2"}"></div>`;
      const box = area.firstElementChild;
      q.options.forEach((opt, idx) => {
        const b = document.createElement("button");
        b.className = "option";
        b.type = "button";
        b.innerHTML = `${opt.emoji ? `<span class="emoji">${opt.emoji}</span>` : ""}${opt.label}`;
        b.onclick = () => {
          [...box.children].forEach(x => x.classList.remove("selected"));
          b.classList.add("selected");
          setAnswer(q, opt.score);
          setTimeout(nextQuestion, 220);
        };
        box.append(b);
        if (Number(state.answers[q.id]) === opt.score && !Object.values(q.options).some((o, i) => i < idx && o.score === opt.score)) b.classList.add("selected");
      });
    }

    function baseSlider({ min = 0, max = 100, value = 50, step = 1, cls = "" } = {}) {
      const inp = document.createElement("input");
      inp.type = "range";
      inp.min = String(min);
      inp.max = String(max);
      inp.step = String(step);
      inp.value = String(value);
      if (cls) inp.className = cls;
      return inp;
    }

    function buildDual(q, area) {
      const savedInner = Number(state.answers[q.id]);
      state.temporary.inner = Number.isFinite(savedInner) ? savedInner : 50;
      state.temporary.outer = Number.isFinite(q.outer) ? q.outer : 50;
      area.innerHTML = `
        <div class="slider-block">
          <div class="slider-tops"><span>🧊 铁石心肠</span><span class="value-pill" id="innerPill">50</span><span>一哄就好 🥺</span></div>
          <div class="range-wrap dual-track">
            <input id="innerRange" type="range" min="0" max="100" value="${state.temporary.inner}" aria-label="真实内心">
            <input id="outerRange" type="range" min="0" max="100" value="${state.temporary.outer}" aria-label="对外表现">
          </div>
          <div class="range-scale"><span>当场翻脸</span><span>转身就原谅</span></div>
          <div class="dual-labels">
            <div class="mini-card"><strong>真实内心</strong><br>只拿它计分：<span id="innerVal">50</span></div>
            <div class="mini-card"><strong>对外形象</strong><br>仅用于内外差对比：<span id="outerVal">50</span></div>
          </div>
        </div>`;
      const ir = el("innerRange"), or = el("outerRange");
      const sync = () => {
        state.temporary.inner = clampScore(ir.value);
        state.temporary.outer = clampScore(or.value);
        q.outer = state.temporary.outer;
        el("innerVal").textContent = String(state.temporary.inner);
        el("outerVal").textContent = String(state.temporary.outer);
        el("innerPill").textContent = String(state.temporary.inner);
        setAnswer(q, state.temporary.inner);
      };
      ir.oninput = sync; or.oninput = sync;
      sync();
    }

    function buildDial(q, area) {
      const saved = Number(state.answers[q.id]);
      const val = Number.isFinite(saved) ? Math.round(saved / 10) : 5;
      area.innerHTML = `
        <div class="slider-block">
          <div class="dial"><div class="dial-face"><div class="dial-pointer" id="dialPointer"></div><div class="dial-hub"></div></div></div>
          <div style="text-align:center"><span class="value-pill" id="dialPill">${val}</span></div>
          <div class="range-wrap"><input id="dialRange" type="range" min="0" max="10" value="${val}"></div>
          <div class="range-scale"><span>0 六亲不认</span><span>10 递张纸巾就破防</span></div>
        </div>`;
      const r = el("dialRange");
      const sync = () => {
        const v = Number(r.value);
        el("dialPointer").style.transform = `translateX(-50%) rotate(${v * 18 - 90}deg)`;
        el("dialPill").textContent = String(v);
        setAnswer(q, v * 10); // 表盘数值 × 10。
      };
      r.oninput = sync; sync();
    }

    function buildTags(q, area) {
      area.innerHTML = `<div class="tag-cloud" id="tagCloud"></div>`;
      const cloud = el("tagCloud");
      let selected = new Set(Array.isArray(q.selected) ? q.selected : []);
      const sync = () => {
        const vals = [...selected].map(i => q.items[i][1]);
        const score = vals.length ? Math.max(...vals) : NaN;
        if (vals.length) setAnswer(q, score);
        else { delete state.answers[q.id]; updateLive(); updateNav(q); }
      };
      q.items.forEach(([label, score], idx) => {
        const b = document.createElement("button");
        b.type = "button";
        b.className = "cloud-tag" + (selected.has(idx) ? " selected" : "");
        b.textContent = label;
        b.onclick = () => {
          selected.has(idx) ? selected.delete(idx) : selected.add(idx);
          b.classList.toggle("selected", selected.has(idx));
          q.selected = [...selected];
          sync();
        };
        cloud.append(b);
      });
      sync();
    }

    function buildSort(q, area) {
      let order = Array.isArray(q.order) && q.order.length === 4 ? [...q.order] : [0, 1, 2, 3];
      area.innerHTML = `<div class="chat-list" id="chatList"></div>`;
      const list = el("chatList");
      function sync() {
        list.innerHTML = "";
        order.forEach((itemIndex, pos) => {
          const row = document.createElement("div");
          row.className = "chat-item";
          row.draggable = true;
          row.dataset.idx = String(itemIndex);
          row.innerHTML = `
            <button class="move-btn" data-dir="-1" aria-label="上移">↑</button>
            <div class="bubble">${pos + 1}. ${q.items[itemIndex].label}</div>
            <button class="move-btn" data-dir="1" aria-label="下移">↓</button>`;
          row.querySelectorAll(".move-btn").forEach(btn => {
            btn.onclick = () => {
              const dir = Number(btn.dataset.dir), to = pos + dir;
              if (to < 0 || to >= order.length) return;
              [order[pos], order[to]] = [order[to], order[pos]];
              q.order = [...order]; sync();
            };
          });
          row.addEventListener("dragstart", e => { row.classList.add("dragging"); e.dataTransfer.setData("text/plain", String(itemIndex)); });
          row.addEventListener("dragend", () => row.classList.remove("dragging"));
          row.addEventListener("dragover", e => e.preventDefault());
          row.addEventListener("drop", e => {
            e.preventDefault();
            const from = order.indexOf(Number(e.dataTransfer.getData("text/plain")));
            if (from < 0 || from === pos) return;
            order.splice(pos, 0, order.splice(from, 1)[0]);
            q.order = [...order]; sync();
          });
          list.append(row);
        });
        // 排序分值：第一名是什么，本题就是什么。
        setAnswer(q, q.items[order[0]].score);
      }
      sync();
    }

    function buildToggles(q, area) {
      area.innerHTML = `<div class="toggle-row" id="toggleRows"></div>`;
      const box = el("toggleRows");
      q.checked = Array.isArray(q.checked) ? q.checked : [false, false, false];
      function sync() {
        const vals = q.items.filter((_, i) => q.checked[i]).map(x => x.score);
        // 取所有开启项中的最高分；全关为0。
        setAnswer(q, vals.length ? Math.max(...vals) : 0);
      }
      q.items.forEach((item, i) => {
        const row = document.createElement("label");
        row.className = "toggle-card";
        row.innerHTML = `
          <span class="switch"><input type="checkbox" ${q.checked[i] ? "checked" : ""}><span class="switch-track"></span></span>
          <span>${item.label}</span>`;
        const cb = row.querySelector("input");
        cb.onchange = () => { q.checked[i] = cb.checked; sync(); };
        box.append(row);
      });
      sync();
    }

    function buildText(q, area) {
      area.innerHTML = `
        <div class="text-analyze">
          <input id="moodInput" maxlength="80" placeholder="输入你想说的任何话…" value="${q.text || ""}">
          <button id="analyzeBtn" class="btn small" type="button">分析</button>
        </div>
        <div class="analyze-result" id="moodOut">${q.analyzed ? `已分析：当前浓度 ${state.answers[q.id]} 分。` : ""}</div>`;
      const input = el("moodInput"), out = el("moodOut"), btn = el("analyzeBtn");
      btn.onclick = () => {
        const s = (input.value || "").trim().toLowerCase();
        if (!s) { out.textContent = "先说点什么吧，空白也是一种态度，但机器不收。"; delete state.answers[q.id]; updateLive(); updateNav(q); return; }
        q.text = input.value; q.analyzed = true;
        const strongHot = ["好吧好吧", "不生气了", "原谅你了", "心软了", "算了原谅", "好感动", "眼睛红了", "下不去手", "心一酸", "说软就软"];
        const mildHot = ["好吧", "嗯嗯", "知道了", "小声", "心虚", "心软", "心惹", "心疼"];
        const lightCold = ["忙", "没事", "随便", "可以", "哦", "嗯", "加油"];
        let score = 50, reason = "没抓到明显心软词，按中位数处理。";
        if (strongHot.some(w => s.includes(w))) { score = s.includes("心软了") || s.includes("好感动") ? 100 : 85; reason = "检测到高浓度当场原谅。"; }
        else if (mildHot.some(w => s.includes(w))) { score = 80; reason = "耳根子软在线，浓度上头。"; }
        else if (lightCold.some(w => s.includes(w))) {
          score = /^(嗯+|哦+|行|随便|都行|还好|无所谓|算了)$/.test(s) ? 0 : (s.includes("无所谓") || s.includes("随便") ? 5 : 20);
          reason = "越冷淡越省事。";
        }
        out.textContent = `${reason} 本题：${score} 分。`;
        setAnswer(q, score);
      };
    }

    function buildRangeVote(q, area) {
      const val = Number.isFinite(Number(state.answers[q.id])) ? Number(state.answers[q.id]) : 50;
      area.innerHTML = `
        <div class="slider-block">
          <div class="slider-tops"><span>🪪 冷脸到底</span><span class="value-pill" id="voteVal">${val}</span><span>眼泪汪汪 🥺</span></div>
          <div class="range-wrap"><input id="voteRange" type="range" min="0" max="100" value="${val}"></div>
          <div class="range-scale"><span>硬到底</span><span>秒心软</span></div>
        </div>`;
      const r = el("voteRange");
      r.oninput = () => { el("voteVal").textContent = r.value; setAnswer(q, r.value); };
      setAnswer(q, val);
    }

    function formatHour(n) {
      const h = Math.floor(n), m = Math.round((n - h) * 60);
      return `${String(h).padStart(2, "0")}:${String(m).padStart(2, "0")}`;
    }

    function buildTimeline(q, area) {
      const saved = Number(state.answers[q.id]);
      const hour = Number.isFinite(saved) ? 6 + saved * 16 / 100 : 14;
      area.innerHTML = `
        <div class="slider-block">
          <div class="slider-tops"><span>🌅 清晨6点</span><span class="value-pill" id="timeVal">${formatHour(hour)}</span><span>🌙 晚上10点</span></div>
          <div class="range-wrap"><input id="timeRange" type="range" min="6" max="22" step="0.25" value="${hour}"></div>
          <div class="range-scale"><span>早上</span><span>中午</span><span>晚上</span></div>
        </div>`;
      const r = el("timeRange");
      const sync = () => {
        const h = Number(r.value);
        el("timeVal").textContent = formatHour(h);
        // 早上6点=0，晚上10点=100，中间线性映射。
        setAnswer(q, (h - 6) * 100 / 16);
      };
      r.oninput = sync; sync();
    }

    function buildSpectrum(q, area) {
      const val = Number.isFinite(Number(state.answers[q.id])) ? Number(state.answers[q.id]) : 50;
      area.innerHTML = `
        <div class="slider-block">
          <div class="slider-tops"><span>冷硬铁灰</span><span class="value-pill" id="specVal">${val}</span><span>心软蜜桃</span></div>
          <div class="range-wrap"><input id="specRange" class="spectrum" type="range" min="0" max="100" value="${val}"></div>
          <div class="range-scale"><span>心硬嘴也硬</span><span>嘴凶心最软</span></div>
        </div>`;
      const r = el("specRange");
      r.oninput = () => { el("specVal").textContent = r.value; setAnswer(q, r.value); };
      setAnswer(q, val);
    }

    function buildSpeed(q, area) {
      const val = Number.isFinite(Number(state.answers[q.id])) ? Number(state.answers[q.id]) : 50;
      area.innerHTML = `
        <div class="slider-block">
          <div class="knob-scene"><div class="knob"><div class="needle" id="speedNeedle">🗣️</div></div></div>
          <div style="text-align:center"><span class="value-pill" id="speedVal">${val}</span></div>
          <div class="range-wrap"><input id="speedRange" class="thin" type="range" min="0" max="100" value="${val}"></div>
          <div class="range-scale"><span>🪪 原地硬扛</span><span>🥺 递台阶就下</span></div>
        </div>`;
      const r = el("speedRange");
      const sync = () => {
        const v = Number(r.value);
        el("speedVal").textContent = String(v);
        el("speedNeedle").style.transform = `rotate(${v * 2.7 - 135}deg)`;
        setAnswer(q, v);
      };
      r.oninput = sync; sync();
    }

    function buildVolume(q, area) {
      const val = Number.isFinite(Number(state.answers[q.id])) ? Number(state.answers[q.id]) : 50;
      area.innerHTML = `
        <div class="slider-block">
          <div class="volume-bars" id="volBars"></div>
          <div style="text-align:center"><span class="value-pill" id="volumeVal">${val}</span></div>
          <div class="range-wrap"><input id="volumeRange" type="range" min="0" max="100" value="${val}"></div>
          <div class="range-scale"><span>谁也撼不动</span><span>一句好话就倒</span></div>
        </div>`;
      const r = el("volumeRange"), bars = el("volBars");
      for (let i = 0; i < 9; i++) {
        const b = document.createElement("div");
        b.className = "vbar"; b.style.animationDelay = `${i * .08}s`; bars.append(b);
      }
      const sync = () => {
        const v = Number(r.value);
        el("volumeVal").textContent = String(v);
        [...bars.children].forEach((bar, i) => {
          const peak = 22 + v * .78;
          bar.style.height = `${Math.max(8, Math.min(100, peak - Math.abs(4 - i) * (v > 65 ? 3 : 7)))}%`;
        });
        setAnswer(q, v); // 音量值直接作为得分。
      };
      r.oninput = sync; sync();
    }

    function buildVotes(q, area) {
      q.votes = Array.isArray(q.votes) ? q.votes : [null, null, null, null, null];
      area.innerHTML = `<div class="vote-scenarios" id="voteBox"></div>`;
      const box = el("voteBox");
      function sync() {
        const chosen = q.votes.filter(v => v === "hot").length;
        // 5个场景各20分，选心软行为得20分/次。
        setAnswer(q, chosen * 20);
      }
      q.scenarios.forEach((scene, si) => {
        const row = document.createElement("div");
        row.className = "vote-row";
        row.innerHTML = `
          <div class="vote-title">${si + 1}. ${scene[0]}</div>
          <div class="vote-btns">
            <button class="vote-btn" data-kind="cold" type="button">🪪 铁石行为<br>${scene[1]}</button>
            <button class="vote-btn" data-kind="hot" type="button">🥺 心软行为<br>${scene[2]}</button>
          </div>`;
        const btns = [...row.querySelectorAll(".vote-btn")];
        const paint = () => btns.forEach(b => b.classList.toggle(b.dataset.kind === "hot" ? "selected-hot" : "selected-cold", q.votes[si] === b.dataset.kind));
        btns.forEach(btn => btn.onclick = () => { q.votes[si] = btn.dataset.kind; paint(); sync(); });
        paint(); box.append(row);
      });
      sync();
    }

    function buildFinal(q, area) {
      const val = Number.isFinite(Number(state.answers[q.id])) ? Number(state.answers[q.id]) : 50;
      area.innerHTML = `
        <div class="slider-block">
          <div class="slider-tops"><span>🪪 我心硬如铁</span><span class="value-pill" id="finalVal">${val}</span><span>我心软本软 🥺</span></div>
          <div class="range-wrap"><input id="finalRange" type="range" min="0" max="100" value="${val}"></div>
          <div class="range-scale"><span>冷战到天荒</span><span>台阶一递就好</span></div>
        </div>`;
      const r = el("finalRange");
      r.oninput = () => { el("finalVal").textContent = r.value; setAnswer(q, r.value); };
      setAnswer(q, val);
    }

    /* ------------------ 心软指数计算逻辑 ------------------
       每道题独立计算得分（0-100）。
       最终心软指数 = Math.round(24道题得分总和 / 24)。
       铁石指数 = 100 - 心软指数。
    ---------------------------------------------------------- */
    function finish() {
      const scores = questions.map(q => clampScore(state.answers[q.id]));
      const hotIndex = Math.round(scores.reduce((sum, score) => sum + score, 0) / 24);
      const coldIndex = 100 - hotIndex;
      el("hotPercent").textContent = String(hotIndex);
      el("coldPercent").textContent = String(coldIndex);
      const verdict = results.find(r => hotIndex <= r.max);
      el("resultName").textContent = verdict.name;
      el("resultText").textContent = verdict.text;
      el("coldSide").style.width = "50%";
      el("hotSide").style.width = "50%";
      showScreen("resultScreen");
      setTimeout(() => {
        el("coldSide").style.width = `${coldIndex}%`;
        el("hotSide").style.width = `${hotIndex}%`;
      }, 120);
    }

    el("startBtn").onclick = () => {
      state.current = 0; state.answers = {};
      questions.forEach(q => { delete q.outer; delete q.order; delete q.selected; delete q.checked; delete q.votes; delete q.text; delete q.analyzed; });
      showScreen("testScreen"); renderQuestion();
    };
    el("restartBtn").onclick = () => el("startBtn").click();
    el("shareBtn").onclick = () => toast("截图给朋友，看TA觉得你有多容易被哄好...");
    window.addEventListener("keydown", e => {
      if (!el("testScreen").classList.contains("active")) return;
      if (e.key === "ArrowLeft") el("prevBtn").click();
      if (e.key === "ArrowRight" && !el("nextBtn").disabled) el("nextBtn").click();
    });
  </script>
</body>

</html>
